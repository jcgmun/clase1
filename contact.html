    <main class="page-main">
      <div class="single-page__hero-section">
        <div class="content-wrapper">
          <h1>Contact</h1>
        </div>
      </div>
      <div class="page__main-content">
        <div class="content-wrapper contact-form__wrapper">
          <h2 class="page__subheading contact-form__subheading">
            Get in touch!
          </h2>
          <form
            class="contact-form"
            action="#"
            method="post"
            id="contact-form"
            novalidate
          >
            <div class="contact-form__row-container">
              <div class="contact-form__field">
                <label class="contact-form__label" for="contact-form__name"
                  >Name</label
                >
                <input
                  class="contact-form__input"
                  type="text"
                  id="contact-form__name"
                  name="name"
                  placeholder="John Coltrane"
                  required
                  maxlength="10"
                />
                <p class="contact-form__error" aria-live="polite"></p>
              </div>
              <div class="contact-form__field">
                <label class="contact-form__label" for="contact-form__email"
                  >Email</label
                >
                <input
                  class="contact-form__input"
                  type="email"
                  id="contact-form__email"
                  name="email"
                  placeholder="johncoltrane@gmail.com"
                  required
                />
                <p class="contact-form__error" aria-live="polite"></p>
              </div>
            </div>
            <div class="contact-form__field">
              <label class="contact-form__label" for="contact-form__subject"
                >Subject</label
              >
              <input
                class="contact-form__input"
                type="text"
                id="contact-form__subject"
                name="subject"
                placeholder="I want to hire you!"
                required
              />
              <p class="contact-form__error" aria-live="polite"></p>
            </div>
            <div class="contact-form__field">
              <label class="contact-form__label" for="contact-form__message"
                >Message</label
              >
              <textarea
                class="contact-form__input contact-form__textarea"
                id="contact-form__message"
                name="message"
                placeholder=""
                required
                rows="5"
                cols="10"
              ></textarea>
              <p class="contact-form__error" aria-live="polite"></p>
            </div>
            <button class="contact-form__button" type="submit">Send</button>
          </form>
        </div>
      </div>
